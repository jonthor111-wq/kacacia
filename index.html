<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#17385f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fire Detector Inspection</title>
<style>
:root{
 --navy:#17385f;--navy2:#224e7e;--bg:#f3f6f9;--card:#fff;--line:#d7e0e8;
 --muted:#6c7886;--ok:#177b43;--ng:#b9332e;--na:#687482;--amber:#906820;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;color:#17212b}
body{padding-bottom:calc(88px + env(safe-area-inset-bottom))}
button,input,textarea{font:inherit}
header{position:sticky;top:0;z-index:40;background:linear-gradient(135deg,var(--navy),var(--navy2));color:#fff;padding:calc(12px + env(safe-area-inset-top)) 14px 11px;box-shadow:0 2px 10px #0002}
.headerRow{display:flex;align-items:center;justify-content:space-between;gap:8px}
.title{font-size:18px;font-weight:900}.subtitle{font-size:10px;opacity:.72;margin-top:2px}
.statusPill{font-size:9px;font-weight:900;padding:5px 8px;border-radius:999px;background:#def1e5;color:#176a3b}
.statusPill.off{background:#fff0d0;color:#785b18}
.version{font-size:9px;opacity:.7;margin-left:4px}
main{max-width:760px;margin:0 auto;padding:10px}
.panel,.itemCard{background:#fff;border:1px solid var(--line);border-radius:15px}
.panel{padding:10px;margin-bottom:9px}
.monthStrip{display:flex;gap:6px;overflow-x:auto;-webkit-overflow-scrolling:touch;padding:1px 0 2px}
.monthBtn{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:9px;padding:8px 11px;font-size:13px;font-weight:850}
.monthBtn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.hero{padding:13px}.heroTop{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.heroTitle{font-size:22px;font-weight:950;color:var(--navy)}
.heroSub{font-size:10px;color:var(--muted);margin-top:2px}
.remain{text-align:right}.remain strong{display:block;font-size:30px;line-height:1;color:var(--amber)}.remain span{font-size:10px;color:var(--muted)}
.progress{height:9px;background:#e7edf2;border-radius:999px;overflow:hidden;margin-top:12px}.progressBar{height:100%;width:0;background:#2f72a5}
.progressText{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px;text-align:center}
.stat{border-radius:10px;padding:8px 2px;background:#eaf2f8}.stat strong{display:block;font-size:18px;color:var(--navy)}.stat span{font-size:9px;color:var(--muted)}
.stat.ok{background:#e6f4eb}.stat.ok strong{color:var(--ok)}.stat.ng{background:#fde9e8}.stat.ng strong{color:var(--ng)}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field label{display:block;font-size:10px;font-weight:800;color:var(--muted);margin-bottom:4px}
.field input,.searchBox{width:100%;min-height:40px;border:1px solid var(--line);border-radius:9px;padding:9px;background:#fff}
.filters{display:grid;grid-template-columns:auto auto auto 1fr;gap:6px}
.filterBtn{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:9px;padding:8px 10px;font-size:13px;font-weight:850}
.filterBtn.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.areaBlock{margin-bottom:11px}.areaHeader{display:flex;justify-content:space-between;align-items:center;background:#e8f1f8;color:var(--navy);border-radius:10px;padding:8px 10px;margin:0 2px 6px}
.areaHeader strong{font-size:13px}.areaHeader span{font-size:10px;color:#587187}
.itemCard{padding:10px;margin-bottom:7px;border-left:5px solid #ccd6df}.itemCard.ok{border-left-color:#50ad70}.itemCard.ng{border-left-color:#d04b45}.itemCard.na{border-left-color:#8994a0}
.itemTop{display:flex;justify-content:space-between;gap:8px}.location{font-size:15px;font-weight:900;line-height:1.25}.address{font-size:10px;color:var(--muted);margin-top:3px}
.badge{height:max-content;background:#edf3f8;color:var(--navy);border-radius:999px;padding:5px 8px;font-size:10px;font-weight:850;white-space:nowrap}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px}
.choice{min-height:40px;border:1px solid var(--line);background:#fff;border-radius:9px;font-weight:900}
.choice.ok.sel{background:#e5f4eb;color:var(--ok);border-color:#9dd0af}.choice.ng.sel{background:#fde8e7;color:var(--ng);border-color:#e4aaa6}.choice.na.sel{background:#edf0f3;color:var(--na);border-color:#c7cfd7}
.remarks{width:100%;min-height:43px;border:1px solid var(--line);border-radius:9px;padding:8px;margin-top:7px;resize:vertical}
.empty{text-align:center;color:var(--muted);padding:30px 6px}
.error{display:none;background:#fde8e7;color:#8f2d29;border:1px solid #e4aaa6;border-radius:10px;padding:10px;font-size:12px;margin-bottom:9px;white-space:pre-wrap}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#ffffffef;border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(8px);z-index:50}
.bottomInner{max-width:760px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}
.bottom button{border:0;border-radius:10px;padding:12px 8px;font-weight:900}.nextBtn{background:#fff1d6;color:#7c5c19}.exportBtn{background:var(--navy);color:#fff}
@media(max-width:430px){.filters{grid-template-columns:repeat(3,auto)}.searchBox{grid-column:1/-1}}
</style>
</head>
<body>
<header>
  <div class="headerRow">
    <div>
      <div class="title">FIRE DETECTOR INSPECTION <span id="version" class="version">v13</span></div>
      <div class="subtitle">Monthly Sampling · Offline</div>
    </div>
    <span id="network" class="statusPill">ONLINE</span>
  </div>
</header>

<main>
  <div id="error" class="error"></div>

  <section class="panel">
    <div class="monthStrip">
      <button type="button" class="monthBtn" data-month="1" onclick="chooseMonth(1)">1월</button><button type="button" class="monthBtn" data-month="2" onclick="chooseMonth(2)">2월</button><button type="button" class="monthBtn" data-month="3" onclick="chooseMonth(3)">3월</button><button type="button" class="monthBtn" data-month="4" onclick="chooseMonth(4)">4월</button><button type="button" class="monthBtn" data-month="5" onclick="chooseMonth(5)">5월</button><button type="button" class="monthBtn" data-month="6" onclick="chooseMonth(6)">6월</button><button type="button" class="monthBtn" data-month="7" onclick="chooseMonth(7)">7월</button><button type="button" class="monthBtn" data-month="8" onclick="chooseMonth(8)">8월</button><button type="button" class="monthBtn" data-month="9" onclick="chooseMonth(9)">9월</button><button type="button" class="monthBtn" data-month="10" onclick="chooseMonth(10)">10월</button><button type="button" class="monthBtn" data-month="11" onclick="chooseMonth(11)">11월</button><button type="button" class="monthBtn" data-month="12" onclick="chooseMonth(12)">12월</button>
    </div>
  </section>

  <section class="panel hero">
    <div class="heroTop">
      <div>
        <div id="monthTitle" class="heroTitle">점검월 로딩 중</div>
        <div class="heroSub">Fire Detector / Push Button Sampling</div>
      </div>
      <div class="remain"><strong id="remaining">0</strong><span>남은 항목</span></div>
    </div>

    <div class="progress"><div id="progressBar" class="progressBar"></div></div>
    <div class="progressText"><span>점검 진행률</span><span id="percent">0%</span></div>

    <div class="stats">
      <div class="stat"><strong id="total">0</strong><span>전체</span></div>
      <div class="stat"><strong id="done">0</strong><span>완료</span></div>
      <div class="stat ok"><strong id="okCount">0</strong><span>OK</span></div>
      <div class="stat ng"><strong id="ngCount">0</strong><span>NG</span></div>
    </div>
  </section>

  <section class="panel meta">
    <div class="field">
      <label>INSPECTED BY</label>
      <input id="inspector" placeholder="점검자 이름">
    </div>
    <div class="field">
      <label>INSPECTED DATE</label>
      <input id="date" type="date">
    </div>
  </section>

  <section class="panel filters">
    <button type="button" class="filterBtn active" data-filter="ALL" onclick="chooseFilter('ALL')">전체</button>
    <button type="button" class="filterBtn" data-filter="PENDING" onclick="chooseFilter('PENDING')">미점검</button>
    <button type="button" class="filterBtn" data-filter="NG" onclick="chooseFilter('NG')">NG</button>
    <input id="search" class="searchBox" placeholder="위치 / Address 검색">
  </section>

  <section id="list"></section>
</main>

<div class="bottom">
  <div class="bottomInner">
    <button type="button" class="nextBtn" onclick="goNextPending()">다음 미점검</button>
    <button type="button" class="exportBtn" onclick="exportMonth()">이번 달 내보내기</button>
  </div>
</div>

  var TYPE_NAMES = {SD:"Smoke", TD:"Thermal", FD:"Flame", PB:"Push Button"};

  var state = {
    month: String(new Date().getMonth() + 1),
    filter: "ALL",
    query: ""
  };

  function el(id) { return document.getElementById(id); }
  function recordKey(m) { return "fireDetector_v13_" + m; }
  function profileKey() { return "fireDetector_v13_profile"; }
  function pad(v) { return String(v).padStart(2, "0"); }

  function safeJSON(text, fallback) {
    try { return JSON.parse(text); } catch (e) { return fallback; }
  }

  function loadRecords(m) {
    return safeJSON(localStorage.getItem(recordKey(m)) || "{}", {});
  }

  function saveRecords(m, records) {
    try { localStorage.setItem(recordKey(m), JSON.stringify(records)); } catch (e) {}
  }

  function escapeHTML(value) {
    return String(value == null ? "" : value).replace(/[&<>"']/g, function(ch) {
      return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[ch];
    });
  }

  window.chooseMonth = function(m) {
    state.month = String(m);
    state.filter = "ALL";
    state.query = "";
    el("search").value = "";
    render();
  };

  window.chooseFilter = function(f) {
    state.filter = f;
    render();
  };

  window.setStatus = function(id, status) {
    var records = loadRecords(state.month);
    var rec = records[id] || {};
    rec.status = status;
    rec.changed = new Date().toLocaleString();
    records[id] = rec;
    saveRecords(state.month, records);
    render();
  };

  window.setRemarks = function(id, value) {
    var records = loadRecords(state.month);
    var rec = records[id] || {};
    rec.remarks = value;
    rec.changed = new Date().toLocaleString();
    records[id] = rec;
    saveRecords(state.month, records);
    updateSummary();
  };

  function getVisibleItems() {
    var records = loadRecords(state.month);
    var q = state.query.trim().toLowerCase();
    var source = MONTHLY[state.month] || [];

    return source.filter(function(item) {
      var status = (records[item.id] || {}).status || "";

      if (state.filter === "PENDING" && status) return false;
      if (state.filter === "NG" && status !== "NG") return false;

      if (q) {
        var hay = [item.location, item.address, item.area, item.type].join(" ").toLowerCase();
        if (hay.indexOf(q) === -1) return false;
      }

      return true;
    });
  }

  function updateSummary() {
    var arr = MONTHLY[state.month] || [];
    var records = loadRecords(state.month);
    var done = 0, ok = 0, ng = 0;

    arr.forEach(function(item) {
      var status = (records[item.id] || {}).status || "";
      if (status) done += 1;
      if (status === "OK") ok += 1;
      if (status === "NG") ng += 1;
    });

    var remain = arr.length - done;
    var percent = arr.length ? Math.round(done / arr.length * 100) : 0;

    el("monthTitle").textContent = pad(state.month) + "월 점검";
    el("remaining").textContent = String(remain);
    el("total").textContent = String(arr.length);
    el("done").textContent = String(done);
    el("okCount").textContent = String(ok);
    el("ngCount").textContent = String(ng);
    el("progressBar").style.width = percent + "%";
    el("percent").textContent = percent + "%";
  }

  function render() {
    document.querySelectorAll(".monthBtn").forEach(function(btn) {
      btn.classList.toggle("active", btn.getAttribute("data-month") === state.month);
    });

    document.querySelectorAll(".filterBtn").forEach(function(btn) {
      btn.classList.toggle("active", btn.getAttribute("data-filter") === state.filter);
    });

    var records = loadRecords(state.month);
    var visible = getVisibleItems();
    var groups = {};
    var order = [];

    visible.forEach(function(item) {
      if (!groups[item.area]) {
        groups[item.area] = [];
        order.push(item.area);
      }
      groups[item.area].push(item);
    });

    var html = "";

    order.forEach(function(area) {
      var items = groups[area];
      var areaDone = items.filter(function(item) {
        return !!((records[item.id] || {}).status);
      }).length;

      html += '<section class="areaBlock">';
      html += '<div class="areaHeader"><strong>' + escapeHTML(area) + '</strong><span>' + areaDone + ' / ' + items.length + ' 완료</span></div>';

      items.forEach(function(item) {
        var rec = records[item.id] || {};
        var status = rec.status || "";
        var cardClass = status === "OK" ? "ok" : status === "NG" ? "ng" : status === "N/A" ? "na" : "";

        html += '<article class="itemCard ' + cardClass + '" id="item_' + item.id + '">';
        html += '<div class="itemTop">';
        html += '<div><div class="location">' + escapeHTML(item.location) + '</div><div class="address">Loop ' + escapeHTML(item.loop) + ' · ' + escapeHTML(item.address) + '</div></div>';
        html += '<span class="badge">' + escapeHTML(item.type) + ' · ' + escapeHTML(TYPE_NAMES[item.type] || "") + '</span>';
        html += '</div>';

        html += '<div class="choices">';
        html += '<button type="button" class="choice ok ' + (status === "OK" ? "sel" : "") + '" onclick="setStatus(\'' + item.id + '\',\'OK\')">OK</button>';
        html += '<button type="button" class="choice ng ' + (status === "NG" ? "sel" : "") + '" onclick="setStatus(\'' + item.id + '\',\'NG\')">NG</button>';
        html += '<button type="button" class="choice na ' + (status === "N/A" ? "sel" : "") + '" onclick="setStatus(\'' + item.id + '\',\'N/A\')">N/A</button>';
        html += '</div>';

        html += '<textarea class="remarks" placeholder="Remarks / 이상사항" oninput="setRemarks(\'' + item.id + '\',this.value)">' + escapeHTML(rec.remarks || "") + '</textarea>';
        html += '</article>';
      });

      html += '</section>';
    });

    el("list").innerHTML = html || '<div class="empty">표시할 항목이 없습니다.</div>';
    updateSummary();
  }

  window.goNextPending = function() {
    var records = loadRecords(state.month);
    var source = MONTHLY[state.month] || [];
    var first = null;

    for (var i = 0; i < source.length; i++) {
      if (!((records[source[i].id] || {}).status)) {
        first = source[i];
        break;
      }
    }

    if (!first) {
      alert("이번 달 점검이 모두 완료되었습니다.");
      return;
    }

    state.filter = "ALL";
    state.query = "";
    el("search").value = "";
    render();

    setTimeout(function() {
      var node = el("item_" + first.id);
      if (node) node.scrollIntoView({behavior:"smooth", block:"center"});
    }, 100);
  };

  function csvEscape(value) {
    var v = String(value == null ? "" : value);
    if (/[",\n]/.test(v)) return '"' + v.replace(/"/g, '""') + '"';
    return v;
  }

  window.exportMonth = function() {
    var records = loadRecords(state.month);
    var rows = [["Month","No","Loop","Area","Address","Location","Type","Result","Remarks"]];
    var arr = MONTHLY[state.month] || [];

    arr.forEach(function(item, index) {
      var rec = records[item.id] || {};
      rows.push([
        pad(state.month), index + 1, item.loop, item.area, item.address,
        item.location, item.type, rec.status || "", rec.remarks || ""
      ]);
    });

    var text = "\ufeff" + rows.map(function(row) {
      return row.map(csvEscape).join(",");
    }).join("\r\n");

    var blob = new Blob([text], {type:"text/csv;charset=utf-8"});
    var link = document.createElement("a");
    link.href = URL.createObjectURL(blob);
    link.download = "FireDetector_" + pad(state.month) + ".csv";
    document.body.appendChild(link);
    link.click();
    link.remove();
    setTimeout(function() { URL.revokeObjectURL(link.href); }, 1000);
  };

  function updateNetwork() {
    var badge = el("network");
    badge.textContent = navigator.onLine ? "ONLINE" : "OFFLINE";
    badge.classList.toggle("off", !navigator.onLine);
  }

  function boot() {
    el("version").textContent = VERSION;

    el("search").addEventListener("input", function(e) {
      state.query = e.target.value;
      render();
    });

    var profile = safeJSON(localStorage.getItem(profileKey()) || "{}", {});
    el("inspector").value = profile.inspector || "";
    el("date").value = profile.date || new Date().toISOString().slice(0,10);

    function saveProfile() {
      try {
        localStorage.setItem(profileKey(), JSON.stringify({
          inspector: el("inspector").value,
          date: el("date").value
        }));
      } catch (e) {}
    }

    el("inspector").addEventListener("input", saveProfile);
    el("date").addEventListener("change", saveProfile);

    window.addEventListener("online", updateNetwork);
    window.addEventListener("offline", updateNetwork);

    updateNetwork();
    render();

    if ("serviceWorker" in navigator) {
      navigator.serviceWorker.register("./sw.js?v=13", {updateViaCache:"none"}).catch(function() {});
    }
  }

  window.addEventListener("error", function(event) {
    var box = el("error");
    if (box) {
      box.style.display = "block";
      box.textContent = "앱 오류: " + event.message;
    }
  });

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", boot);
  } else {
    boot();
  }
})();
</script>
</body>
</html>
