let month=String(new Date().getMonth()+1),filter="ALL",query="";
const k=m=>"fd_onefile_"+m, pk="fd_onefile_profile";
const get=m=>{try{return JSON.parse(localStorage.getItem(k(m))||"{}")}catch(e){return {}}};
const save=(m,s)=>localStorage.setItem(k(m),JSON.stringify(s));
const esc=v=>String(v??"").replace(/[&<>"']/g,x=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[x]));
const pad=v=>String(v).padStart(2,"0");

function setMonth(m){month=String(m);filter="ALL";query="";search.value="";render()}
function setFilter(f){filter=f;render()}
function mark(id,status){const s=get(month);s[id]={...(s[id]||{}),status,changed:new Date().toLocaleString()};save(month,s);render()}
function remark(id,val){const s=get(month);s[id]={...(s[id]||{}),remarks:val,changed:new Date().toLocaleString()};save(month,s);update()}
function data(){const s=get(month),q=query.trim().toLowerCase();return (MONTHLY[month]||[]).filter(x=>{const st=(s[x.id]||{}).status||"";if(filter==="PENDING"&&st)return false;if(filter==="NG"&&st!=="NG")return false;if(q&&!(`${x.location} ${x.address} ${x.area} ${x.type}`).toLowerCase().includes(q)))return false;return true})}
function update(){const arr=MONTHLY[month]||[],s=get(month),vals=arr.map(x=>(s[x.id]||{}).status||"");const done=vals.filter(Boolean).length,oks=vals.filter(x=>x==="OK").length,ngs=vals.filter(x=>x==="NG").length,remain=arr.length-done,p=arr.length?Math.round(done/arr.length*100):0;title.textContent=pad(month)+"월 점검";remaining.textContent=remain;total.textContent=arr.length;doneN.textContent=done;okN.textContent=oks;ngN.textContent=ngs;bar.style.width=p+"%";pct.textContent=p+"%"}
function render(){document.querySelectorAll("[data-month]").forEach(b=>b.classList.toggle("active",b.dataset.month===month));document.querySelectorAll("[data-filter]").forEach(b=>b.classList.toggle("active",b.dataset.filter===filter));const s=get(month),arr=data(),groups={};for(const x of arr)(groups[x.area]||(groups[x.area]=[])).push(x);let h="";for(const [area,items] of Object.entries(groups)){const d=items.filter(x=>(s[x.id]||{}).status).length;h+=`<section class="area"><div class="area-head"><strong>${esc(area)}</strong><span>${d} / ${items.length} 완료</span></div>`;for(const x of items){const r=s[x.id]||{},v=r.status||"",cls=v==="OK"?"ok":v==="NG"?"ng":v==="N/A"?"na":"";h+=`<article class="card ${cls}" id="c_${x.id}"><div class="cardhead"><div><div class="loc">${esc(x.location)}</div><div class="addr">Loop ${x.loop} · ${esc(x.address)}</div></div><span class="badge">${x.type} · ${TYPE[x.type]||""}</span></div><div class="choices"><button class="choice ok ${v==="OK"?"sel ok":""}" onclick="mark('${x.id}','OK')">OK</button><button class="choice ng ${v==="NG"?"sel ng":""}" onclick="mark('${x.id}','NG')">NG</button><button class="choice na ${v==="N/A"?"sel na":""}" onclick="mark('${x.id}','N/A')">N/A</button></div><textarea class="remark" placeholder="Remarks / 이상사항" oninput="remark('${x.id}',this.value)">${esc(r.remarks||"")}</textarea></article>`}h+="</section>"}list.innerHTML=h||'<div class="empty">표시할 항목이 없습니다.</div>';update()}
function nextPending(){const s=get(month),x=(MONTHLY[month]||[]).find(x=>!(s[x.id]||{}).status);if(!x){alert("이번 달 점검이 모두 완료되었습니다.");return}filter="ALL";query="";search.value="";render();setTimeout(()=>document.getElementById("c_"+x.id)?.scrollIntoView({behavior:"smooth",block:"center"}),80)}
function csvEsc(v){v=String(v??"");return /[",\n]/.test(v)?'"'+v.replaceAll('"','""')+'"':v}
function exportCSV(){const s=get(month),rows=[["Month","No","Loop","Area","Address","Location","Type","Result","Remarks"]];(MONTHLY[month]||[]).forEach((x,i)=>{const r=s[x.id]||{};rows.push([pad(month),i+1,x.loop,x.area,x.address,x.location,x.type,r.status||"",r.remarks||""])});const txt="\ufeff"+rows.map(r=>r.map(csvEsc).join(",")).join("\r\n"),blob=new Blob([txt],{type:"text/csv;charset=utf-8"}),a=document.createElement("a");a.href=URL.createObjectURL(blob);a.download=`FireDetector_${pad(month)}.csv`;a.click();setTimeout(()=>URL.revokeObjectURL(a.href),1000)}
