<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#15375f">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Fire Detector Inspection</title>
<style>
:root{--navy:#15375f;--bg:#f3f6f9;--line:#d8e1e8;--muted:#6f7b88;--ok:#168045;--ng:#bd352f;--na:#6c7682;--amber:#8d671f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",Arial,sans-serif;color:#18222c}
body{padding-bottom:calc(84px + env(safe-area-inset-bottom))}
button,input,textarea{font:inherit}
header{position:sticky;top:0;z-index:30;background:var(--navy);color:#fff;padding:calc(12px + env(safe-area-inset-top)) 14px 11px;box-shadow:0 2px 10px #0002}
.headrow{display:flex;justify-content:space-between;align-items:center;gap:8px}
.title{font-size:18px;font-weight:900}.sub{font-size:10px;opacity:.72;margin-top:2px}
.net{font-size:9px;font-weight:900;border-radius:999px;padding:5px 8px;background:#dff2e6;color:#166b3a}.net.off{background:#fff0d2;color:#775b16}
.version{font-size:9px;opacity:.75;margin-left:6px}
main{max-width:760px;margin:auto;padding:10px}
.panel,.card{background:#fff;border:1px solid var(--line);border-radius:15px}.panel{padding:10px;margin-bottom:9px}
.months{display:flex;gap:6px;overflow:auto;-webkit-overflow-scrolling:touch}
.months button{flex:0 0 auto;border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:9px;padding:8px 11px;font-weight:850}
.months button.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.hero{padding:13px}.heroTop{display:flex;justify-content:space-between;align-items:flex-start}
.monthTitle{font-size:22px;font-weight:950;color:var(--navy)}.small{font-size:10px;color:var(--muted);margin-top:2px}
.remain{text-align:right}.remain b{display:block;font-size:30px;line-height:1;color:var(--amber)}.remain span{font-size:10px;color:var(--muted)}
.progress{height:9px;background:#e7edf2;border-radius:999px;overflow:hidden;margin-top:12px}.progress i{display:block;height:100%;background:#2f72a5;width:0}
.progressLine{display:flex;justify-content:space-between;font-size:10px;color:var(--muted);margin-top:4px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;margin-top:10px;text-align:center}
.stat{border-radius:10px;padding:8px 2px;background:#eaf2f8}.stat b{display:block;font-size:18px;color:var(--navy)}.stat span{font-size:9px;color:var(--muted)}
.stat.ok{background:#e6f4eb}.stat.ok b{color:var(--ok)}.stat.ng{background:#fde9e7}.stat.ng b{color:var(--ng)}
.meta{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.field label{display:block;font-size:10px;font-weight:800;color:var(--muted);margin-bottom:4px}
.field input,.search{width:100%;min-height:40px;border:1px solid var(--line);border-radius:9px;padding:9px;background:#fff}
.filters{display:grid;grid-template-columns:auto auto auto 1fr;gap:6px}
.filter{border:1px solid var(--line);background:#fff;color:var(--navy);border-radius:9px;padding:8px 10px;font-weight:850}.filter.active{background:var(--navy);color:#fff}
.area{margin-bottom:11px}.areaHead{display:flex;justify-content:space-between;background:#e8f1f8;color:var(--navy);border-radius:10px;padding:8px 10px;margin:0 2px 6px}
.areaHead strong{font-size:13px}.areaHead span{font-size:10px;color:#567187}
.card{padding:10px;margin-bottom:7px;border-left:5px solid #ccd6df}.card.ok{border-left-color:#4ead70}.card.ng{border-left-color:#d04a44}.card.na{border-left-color:#8a95a1}
.cardTop{display:flex;justify-content:space-between;gap:8px}.loc{font-size:15px;font-weight:900;line-height:1.25}.addr{font-size:10px;color:var(--muted);margin-top:3px}
.badge{height:max-content;background:#edf3f8;color:var(--navy);border-radius:999px;padding:5px 8px;font-size:10px;font-weight:850;white-space:nowrap}
.choices{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:9px}
.choice{min-height:40px;border:1px solid var(--line);background:#fff;border-radius:9px;font-weight:900}
.choice.sel.ok{background:#e5f4eb;color:var(--ok);border-color:#9dd0af}.choice.sel.ng{background:#fde8e7;color:var(--ng);border-color:#e3aaa6}.choice.sel.na{background:#edf0f3;color:var(--na);border-color:#c6ced6}
.remark{width:100%;min-height:43px;border:1px solid var(--line);border-radius:9px;padding:8px;margin-top:7px;resize:vertical}
.empty{text-align:center;color:var(--muted);padding:30px}
.errorbox{background:#fde8e7;color:#912d29;border:1px solid #e4aaa6;border-radius:10px;padding:10px;font-size:12px;display:none;margin-bottom:9px;white-space:pre-wrap}
.bottom{position:fixed;left:0;right:0;bottom:0;background:#ffffffef;border-top:1px solid var(--line);padding:8px 10px calc(8px + env(safe-area-inset-bottom));backdrop-filter:blur(8px);z-index:40}
.bottomIn{max-width:760px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:8px}.bottom button{border:0;border-radius:10px;padding:12px 8px;font-weight:900}
.next{background:#fff1d6;color:#7b5c1a}.export{background:var(--navy);color:#fff}
@media(max-width:430px){.filters{grid-template-columns:repeat(3,auto)}.search{grid-column:1/-1}}
</style>
</head>
<body>
<header>
  <div class="headrow">
    <div><div class="title">FIRE DETECTOR INSPECTION <span id="version" class="version"></span></div><div class="sub">Monthly Sampling · Offline</div></div>
    <span id="net" class="net">ONLINE</span>
  </div>
</header>
<main>
  <div id="error" class="errorbox"></div>
  <section class="panel"><div id="months" class="months"></div></section>
  <section class="panel hero">
    <div class="heroTop"><div><div id="monthTitle" class="monthTitle"></div><div class="small">Fire Detector / Push Button Sampling</div></div><div class="remain"><b id="remain">0</b><span>남은 항목</span></div></div>
    <div class="progress"><i id="bar"></i></div><div class="progressLine"><span>진행률</span><span id="pct">0%</span></div>
    <div class="stats"><div class="stat"><b id="total">0</b><span>전체</span></div><div class="stat"><b id="done">0</b><span>완료</span></div><div class="stat ok"><b id="okN">0</b><span>OK</span></div><div class="stat ng"><b id="ngN">0</b><span>NG</span></div></div>
  </section>
  <section class="panel meta"><div class="field"><label>INSPECTED BY</label><input id="inspector" placeholder="점검자 이름"></div><div class="field"><label>INSPECTED DATE</label><input id="date" type="date"></div></section>
  <section class="panel filters"><button class="filter active" data-filter="ALL" onclick="setFilter('ALL')">전체</button><button class="filter" data-filter="PENDING" onclick="setFilter('PENDING')">미점검</button><button class="filter" data-filter="NG" onclick="setFilter('NG')">NG</button><input id="search" class="search" placeholder="위치 / Address 검색"></section>
  <section id="list"></section>
</main>
<div class="bottom"><div class="bottomIn"><button class="next" onclick="nextPending()">다음 미점검</button><button class="export" onclick="exportCSV()">이번 달 내보내기</button></div></div>

const TYPE={SD:"Smoke",TD:"Thermal",FD:"Flame",PB:"Push Button"};

let selectedMonth=String(new Date().getMonth()+1);
let currentFilter="ALL";
let searchQuery="";

const $=id=>document.getElementById(id);
const els={
  months:$("months"), monthTitle:$("monthTitle"), remain:$("remain"), total:$("total"),
  done:$("done"), okN:$("okN"), ngN:$("ngN"), bar:$("bar"), pct:$("pct"),
  inspector:$("inspector"), date:$("date"), search:$("search"), list:$("list"),
  net:$("net"), version:$("version"), error:$("error")
};

const recordKey=m=>"fd_v12_"+m;
const profileKey="fd_v12_profile";
const pad=v=>String(v).padStart(2,"0");

function loadRecords(m){
  try{return JSON.parse(localStorage.getItem(recordKey(m))||"{}");}
  catch(e){return {};}
}
function storeRecords(m,data){
  try{localStorage.setItem(recordKey(m),JSON.stringify(data));}catch(e){}
}
function esc(v){
  return String(v??"").replace(/[&<>"']/g,ch=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch]));
}

window.selectMonth=function(m){
  selectedMonth=String(m);currentFilter="ALL";searchQuery="";
  els.search.value="";
  render();
};
window.setFilter=function(f){currentFilter=f;render();};
window.mark=function(id,status){
  const records=loadRecords(selectedMonth);
  records[id]={...(records[id]||{}),status:status,changed:new Date().toLocaleString()};
  storeRecords(selectedMonth,records);
  render();
};
window.saveRemark=function(id,value){
  const records=loadRecords(selectedMonth);
  records[id]={...(records[id]||{}),remarks:value,changed:new Date().toLocaleString()};
  storeRecords(selectedMonth,records);
  updateSummary();
};
window.nextPending=function(){
  const records=loadRecords(selectedMonth);
  const item=(MONTHLY[selectedMonth]||[]).find(x=>!(records[x.id]||{}).status);
  if(!item){alert("이번 달 점검이 모두 완료되었습니다.");return;}
  currentFilter="ALL";searchQuery="";els.search.value="";
  render();
  setTimeout(()=>document.getElementById("card_"+item.id)?.scrollIntoView({behavior:"smooth",block:"center"}),100);
};
window.exportCSV=function(){
  const records=loadRecords(selectedMonth);
  const rows=[["Month","No","Loop","Area","Address","Location","Type","Result","Remarks"]];
  (MONTHLY[selectedMonth]||[]).forEach((x,i)=>{
    const r=records[x.id]||{};
    rows.push([pad(selectedMonth),i+1,x.loop,x.area,x.address,x.location,x.type,r.status||"",r.remarks||""]);
  });
  const csvEscape=v=>{v=String(v??"");return /[",\n]/.test(v)?'"'+v.replaceAll('"','""')+'"':v;};
  const text="\ufeff"+rows.map(row=>row.map(csvEscape).join(",")).join("\r\n");
  const a=document.createElement("a");
  a.href=URL.createObjectURL(new Blob([text],{type:"text/csv;charset=utf-8"}));
  a.download=`FireDetector_${pad(selectedMonth)}.csv`;
  document.body.appendChild(a);a.click();a.remove();
  setTimeout(()=>URL.revokeObjectURL(a.href),1000);
};

function visibleItems(){
  const records=loadRecords(selectedMonth);
  const q=searchQuery.trim().toLowerCase();
  return (MONTHLY[selectedMonth]||[]).filter(x=>{
    const status=(records[x.id]||{}).status||"";
    if(currentFilter==="PENDING"&&status)return false;
    if(currentFilter==="NG"&&status!=="NG")return false;
    if(q&&!(`${x.location} ${x.address} ${x.area} ${x.type}`).toLowerCase().includes(q)))return false;
    return true;
  });
}

function updateSummary(){
  const arr=MONTHLY[selectedMonth]||[];
  const records=loadRecords(selectedMonth);
  const statuses=arr.map(x=>(records[x.id]||{}).status||"");
  const doneCount=statuses.filter(Boolean).length;
  const okCount=statuses.filter(v=>v==="OK").length;
  const ngCount=statuses.filter(v=>v==="NG").length;
  const remaining=arr.length-doneCount;
  const percent=arr.length?Math.round(doneCount/arr.length*100):0;

  els.monthTitle.textContent=pad(selectedMonth)+"월 점검";
  els.remain.textContent=remaining;
  els.total.textContent=arr.length;
  els.done.textContent=doneCount;
  els.okN.textContent=okCount;
  els.ngN.textContent=ngCount;
  els.bar.style.width=percent+"%";
  els.pct.textContent=percent+"%";
}

function render(){
  document.querySelectorAll("[data-month]").forEach(btn=>btn.classList.toggle("active",btn.dataset.month===selectedMonth));
  document.querySelectorAll("[data-filter]").forEach(btn=>btn.classList.toggle("active",btn.dataset.filter===currentFilter));

  const records=loadRecords(selectedMonth);
  const arr=visibleItems();
  const groups={};
  for(const item of arr){
    if(!groups[item.area])groups[item.area]=[];
    groups[item.area].push(item);
  }

  let html="";
  for(const [area,items] of Object.entries(groups)){
    const areaDone=items.filter(x=>(records[x.id]||{}).status).length;
    html+=`<section class="area"><div class="areaHead"><strong>${esc(area)}</strong><span>${areaDone} / ${items.length} 완료</span></div>`;
    for(const item of items){
      const r=records[item.id]||{};
      const st=r.status||"";
      const cls=st==="OK"?"ok":st==="NG"?"ng":st==="N/A"?"na":"";
      html+=`<article class="card ${cls}" id="card_${item.id}">
        <div class="cardTop">
          <div><div class="loc">${esc(item.location)}</div><div class="addr">Loop ${item.loop} · ${esc(item.address)}</div></div>
          <span class="badge">${item.type} · ${TYPE[item.type]||""}</span>
        </div>
        <div class="choices">
          <button class="choice ${st==="OK"?"sel ok":""}" onclick="mark('${item.id}','OK')">OK</button>
          <button class="choice ${st==="NG"?"sel ng":""}" onclick="mark('${item.id}','NG')">NG</button>
          <button class="choice ${st==="N/A"?"sel na":""}" onclick="mark('${item.id}','N/A')">N/A</button>
        </div>
        <textarea class="remark" placeholder="Remarks / 이상사항" oninput="saveRemark('${item.id}',this.value)">${esc(r.remarks||"")}</textarea>
      </article>`;
    }
    html+="</section>";
  }
  els.list.innerHTML=html||'<div class="empty">표시할 항목이 없습니다.</div>';
  updateSummary();
}

function setNetworkBadge(){
  els.net.textContent=navigator.onLine?"ONLINE":"OFFLINE";
  els.net.classList.toggle("off",!navigator.onLine);
}

function boot(){
  els.version.textContent=APP_VERSION;
  els.months.innerHTML=Array.from({length:12},(_,i)=>`<button data-month="${i+1}" onclick="selectMonth(${i+1})">${i+1}월</button>`).join("");

  let profile={};
  try{profile=JSON.parse(localStorage.getItem(profileKey)||"{}");}catch(e){}
  els.inspector.value=profile.inspector||"";
  els.date.value=profile.date||new Date().toISOString().slice(0,10);

  const saveProfile=()=>{
    try{localStorage.setItem(profileKey,JSON.stringify({inspector:els.inspector.value,date:els.date.value}));}catch(e){}
  };
  els.inspector.addEventListener("input",saveProfile);
  els.date.addEventListener("change",saveProfile);
  els.search.addEventListener("input",e=>{searchQuery=e.target.value;render();});
  window.addEventListener("online",setNetworkBadge);
  window.addEventListener("offline",setNetworkBadge);

  setNetworkBadge();
  render();

  if("serviceWorker" in navigator){
    navigator.serviceWorker.register("./sw.js?v=12",{updateViaCache:"none"}).catch(()=>{});
  }
}

window.addEventListener("error",event=>{
  els.error.style.display="block";
  els.error.textContent="앱 오류: "+event.message;
});

if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",boot);
else boot();
})();
</script>
</body></html>
